[package]
name = "oxihome-linux-monitor"
version = "0.3.0"
edition = "2024"

[dependencies]
anyhow = "1"
jiff = "0.2.38"
oxihome-node = { path = "../node", features = ["mqtt"] }
oxihome-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39", default-features = false, features = ["component", "disk", "network", "system"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = "1"

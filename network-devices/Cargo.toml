[package]
name = "oxihome-network-devices"
version = "0.4.0"
edition = "2024"

[dependencies]
anyhow = "1"
jiff = "0.2.38"
oxihome-node = { path = "../node", features = ["mqtt"] }
oxihome-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[package]
name = "oxihome-weather"
version = "0.3.2"
edition = "2024"

[dependencies]
anyhow = "1"
oxihome-node = { path = "../node", features = ["mqtt"] }
oxihome-protocol = { path = "../protocol" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
toml = "1"

[dev-dependencies]
serde_json = "1"

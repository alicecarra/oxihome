[package]
name = "oxihome-node"
version = "0.6.0"
edition = "2024"

[dependencies]
anyhow = { version = "1", optional = true }
oxihome-protocol = { path = "../protocol" }
rumqttc = { version = "0.25", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
tokio = { version = "1", features = ["macros", "rt", "signal", "sync", "time"], optional = true }
toml = { version = "1", optional = true }

[features]
mqtt = ["dep:anyhow", "dep:rumqttc", "dep:serde", "dep:tokio", "dep:toml"]

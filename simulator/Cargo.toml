[package]
name = "oxihome-simulator"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
oxihome-node = { path = "../node", features = ["mqtt"] }
oxihome-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
toml = "1"

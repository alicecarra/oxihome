[workspace]
resolver = "2"
members = ["hub", "linux-monitor", "network-devices", "node", "protocol", "printer", "reminders", "rss", "simulator", "telegram", "weather"]
# Built with the Xtensa toolchain and its own target; see firmware/.cargo/config.toml.
exclude = ["firmware"]

# The login test hashes a password; unoptimized argon2 takes seconds.
[profile.test.package.argon2]
opt-level = 3

[profile.test.package.blake2]
opt-level = 3

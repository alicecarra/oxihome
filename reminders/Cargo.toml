[package]
name = "oxihome-reminders"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
croner = { version = "4", default-features = false, features = ["jiff"] }
jiff = { version = "0.2.38", features = ["serde", "tzdb-bundle-always"] }
oxihome-node = { path = "../node", features = ["mqtt"] }
oxihome-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
toml = "1"

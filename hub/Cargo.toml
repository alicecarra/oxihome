[package]
name = "oxihome-hub"
version = "0.8.4"
edition = "2024"

[dependencies]
anyhow = "1"
futures-util = { version = "0.3", default-features = false }
oxihome-protocol = { path = "../protocol" }
rumqttc = "0.25"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
topcoat = { version = "=0.10.0", features = ["icon-iconify", "sse", "tailwind", "ui"] }
toml = "1"
toml_edit = "0.25"
jiff = { version = "0.2.38", features = ["serde"] }
croner = { version = "4", default-features = false, features = ["jiff"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
serde_json = "1"
argon2 = "0.5"
password-hash = { version = "0.5", features = ["getrandom"] }

[build-dependencies]
topcoat = { version = "=0.10.0", default-features = false, features = ["icon-iconify", "tailwind", "ui"] }

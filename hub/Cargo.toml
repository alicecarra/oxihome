[package]
name = "oxihome-hub"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
oxihome-protocol = { path = "../protocol" }
rumqttc = "0.25"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
topcoat = { version = "=0.10.0", features = ["tailwind", "ui"] }
toml = "1"
jiff = { version = "0.2.38", features = ["serde"] }

[build-dependencies]
topcoat = { version = "=0.10.0", default-features = false, features = ["tailwind", "ui"] }

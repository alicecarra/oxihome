[[rules]]
name = "Test board button held down"
when = { device = "esp32-08d1f9ca41e4", entity = 2, channel = 0, event = "LongPress" }
then = [
    { notify = { title = "Test board", message = "BOOT button held down" } },
]

[[rules]]
name = "Disabled rule"
enabled = false
when = { device = "esp32-08d1f9ca41e4", entity = 2, channel = 0, event = "LongPress" }
then = [
    { notify = { title = "Disabled message", message = "why are you seeing this???" } },
]


[[rules]]
name = "Test board LED on for waking up"
enabled = false
when = { at = "07:00", days = [
    "monday",
    "tuesday",
    "wednesday",
    "thursday",
    "friday",
] }
then = [
    { set = { device = "esp32-08d1f9ca41e4", entity = 1, channel = 0, value = true } },
]

[[rules]]
name = "Any node offline: buzzer alarm"
when = { offline = "*" }
then = [{ invoke = { device = "esp32-08d1f9ca41e4", entity = 5, channel = 0, value = "Alarm" } }]

[[rules]]
name = "Pi-hole stopped: buzzer alarm"
enabled = false
when = { device = "docker-host", entity = 50, channel = 6, event = "Received", data = "stopped" }
then = [{ invoke = { device = "esp32-08d1f9ca41e4", entity = 5, channel = 0, value = "Alarm" } }]

[[rules]]
name = "Jellyfin stopped: buzzer alarm"
enabled = false
when = { device = "docker-host", entity = 51, channel = 6, event = "Received", data = "stopped" }
then = [{ invoke = { device = "esp32-08d1f9ca41e4", entity = 5, channel = 0, value = "Alarm" } }]

[[rules]]
name = "Trilium stopped: buzzer alarm"
when = { device = "docker-host", entity = 52, channel = 6, event = "Received", data = "stopped" }
then = [{ invoke = { device = "esp32-08d1f9ca41e4", entity = 5, channel = 0, value = "Alarm" } }]

[[rules]]
name = "Portainer stopped: buzzer alarm"
enabled = false
when = { device = "docker-host", entity = 53, channel = 6, event = "Received", data = "stopped" }
then = [{ invoke = { device = "esp32-08d1f9ca41e4", entity = 5, channel = 0, value = "Alarm" } }]

[[rules]]
name = "Remote key 0 toggles the external LED"
when = { remote = "Kit Lafvin", key = "0" }
then = [{ toggle = { device = "esp32-08d1f9ca41e4", entity = 4, channel = 0 } }]

[[rules]]
name = "Remote key 1 beeps short"
when = { remote = "Kit Lafvin", key = "1" }
then = [{ invoke = { device = "esp32-08d1f9ca41e4", entity = 5, channel = 0, value = "Short" } }]

[[rules]]
name = "Remote key 2 beeps long"
when = { remote = "Kit Lafvin", key = "2" }
then = [{ invoke = { device = "esp32-08d1f9ca41e4", entity = 5, channel = 0, value = "Long" } }]

[[rules]]
name = "Remote key 3 sounds the alarm"
when = { remote = "Kit Lafvin", key = "3" }
then = [{ invoke = { device = "esp32-08d1f9ca41e4", entity = 5, channel = 0, value = "Alarm" } }]

[[rules]]
name = "Receiver power toggles the external LED"
when = { remote = "Receiver", key = "power" }
then = [{ toggle = { device = "esp32-08d1f9ca41e4", entity = 4, channel = 0 } }]

[[rules]]
name = "Turn on the LEDs with a beep"
when = { button = "Turn on" }
then = [
    { set = { device = "esp32-08d1f9ca41e4", entity = 1, channel = 0, value = true } },
    { set = { device = "esp32-08d1f9ca41e4", entity = 4, channel = 0, value = true } },
    { invoke = { device = "esp32-08d1f9ca41e4", entity = 5, channel = 0, value = "Short" } },
]

[[rules]]
name = "Turn off every light"
when = { button = "Turn off" }
then = [
    { set = { device = "esp32-08d1f9ca41e4", entity = 1, channel = 0, value = false } },
    { set = { device = "esp32-08d1f9ca41e4", entity = 4, channel = 0, value = false } },
]

[[rules]]
name = "Test board hot: beep and warn, daytime only"
enabled = false
when = { device = "esp32-08d1f9ca41e4", entity = 3, channel = 0, above = 28 }
if = [{ from = "08:00", to = "22:00" }]
then = [
    { invoke = { device = "esp32-08d1f9ca41e4", entity = 5, channel = 0, value = "Long" } },
    { notify = { title = "Test board", message = "Above 28 °C" } },
]

[[rules]]
name = "Outra placa button: beep on the test board"
when = { device = "esp32-14335c2e7270", entity = 2, channel = 0, event = "Press" }
then = [{ invoke = { device = "esp32-08d1f9ca41e4", entity = 5, channel = 0, value = "Short" } }, { notify = { title = "BEEP", message = "beep" } }]

[[rules]]
name = "tablet out of Internet"
when = { device = "network-devices", entity = 2, channel = 1, event = "Received", data = "offline" }
then = [
    { invoke = { device = "esp32-08d1f9ca41e4", entity = 5, channel = 0, value = "Alarm" } },
]

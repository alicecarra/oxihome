[[rules]]
name = "Living room button toggles bedroom lamp"
when = { device = "sim-living-room", entity = 2, channel = 0, event = "Press" }
then = [{ toggle = { device = "sim-bedroom", entity = 1, channel = 0 } }]

[[rules]]
name = "Test board button held down"
when = { device = "esp32-08d1f9ca41e4", entity = 2, channel = 0, event = "LongPress" }
then = [{ notify = { title = "Test board", message = "BOOT button held down" } }]

[[rules]]
name = "Disabled rule"
enabled = false
when = { device = "esp32-08d1f9ca41e4", entity = 2, channel = 0, event = "LongPress" }
then = [{ notify = { title = "Disabled message", message = "why are you seeing this???" } }]

[[rules]]
name = "Bedroom lamp off at night"
when = { at = "23:00" }
then = [{ set = { device = "sim-bedroom", entity = 1, channel = 0, value = false } }]

[[rules]]
name = "Test board LED on for waking up"
when = { at = "07:00", days = ["monday", "tuesday", "wednesday", "thursday", "friday"] }
then = [{ set = { device = "esp32-08d1f9ca41e4", entity = 1, channel = 0, value = true } }]

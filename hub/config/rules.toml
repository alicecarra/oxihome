# Presence (network-devices: 1 Alice S23, 2 tablet, 3 Alice Watch6)

[[rules]]
name = "Arrived home at night: external LED and Telegram"
when = { device = "network-devices", entity = 1, channel = 1, event = "Received", data = "online" }
cooldown = "30m"
if = [{ from = "18:00", to = "06:00" }]
then = [
    { set = { device = "esp32-08d1f9ca41e4", entity = 4, channel = 0, value = true } },
    { invoke = { device = "telegram", entity = 1, channel = 0, value = "Welcome home" } },
]

[[rules]]
name = "Left home: lights and receiver off, Telegram"
when = { device = "network-devices", entity = 1, channel = 1, event = "Received", data = "offline" }
cooldown = "30m"
then = [
    { set = { device = "esp32-08d1f9ca41e4", entity = 1, channel = 0, value = false } },
    { set = { device = "esp32-08d1f9ca41e4", entity = 4, channel = 0, value = false } },
    { invoke = { device = "esp32-14335c2e7270", entity = 3, channel = 0, value = "SONY15 30 2F" } },
    { invoke = { device = "telegram", entity = 1, channel = 0, value = "You left home, the lights and the receiver are off" } },
]

[[rules]]
name = "Tablet left the network: Telegram"
when = { device = "network-devices", entity = 2, channel = 1, event = "Received", data = "offline" }
cooldown = "1h"
then = [
    { invoke = { device = "telegram", entity = 1, channel = 0, value = "The tablet left the network" } },
]

# TV and receiver (IR emitter: RC6 is the Philips TV, SONY15 30 the receiver, keys in remotes.toml)

[[rules]]
name = "Turn on TV"
when = { button = "Turn on TV" }
then = [
    { invoke = { device = "esp32-14335c2e7270", entity = 3, channel = 0, value = "RC6 00 0C" } },
    { invoke = { device = "esp32-14335c2e7270", entity = 3, channel = 0, value = "SONY15 30 2E" } },
    { wait = "2s" },
    { invoke = { device = "esp32-14335c2e7270", entity = 3, channel = 0, value = "SONY15 30 6A" } },
]

# Weather

[[rules]]
name = "Started raining: Telegram"
when = { device = "weather", entity = 1, channel = 2, above = 0 }
cooldown = "3h"
then = [
    { invoke = { device = "telegram", entity = 1, channel = 0, value = "It started raining ({value})." } },
]

[[rules]]
name = "Cold day: Telegram in the morning"
when = { at = "07:00" }
if = [{ device = "weather", entity = 2, channel = 1, below = 10 }]
then = [
    { invoke = { device = "telegram", entity = 1, channel = 0, value = "Cold today: the minimum is below 10 °C" } },
]

[[rules]]
name = "Strong wind: Telegram"
when = { device = "weather", entity = 1, channel = 3, above = 50 }
cooldown = "1h"
then = [
    { invoke = { device = "telegram", entity = 1, channel = 0, value = "Strong wind: {value}" } },
]

# 3D printer (printer: the K1C; entity 2 channel 7 is the job's change event)

[[rules]]
name = "K1C finished: Telegram"
when = { device = "printer", entity = 2, channel = 7, event = "Received", data = "finished" }
then = [
    { invoke = { device = "telegram", entity = 1, channel = 0, value = "K1C: print finished" } },
]

[[rules]]
name = "K1C failed: Telegram"
when = { device = "printer", entity = 2, channel = 7, event = "Received", data = "failed" }
then = [
    { invoke = { device = "telegram", entity = 1, channel = 0, value = "K1C: print failed" } },
]

# It also pauses by itself when the filament runs out.
[[rules]]
name = "K1C paused: Telegram"
when = { device = "printer", entity = 2, channel = 7, event = "Received", data = "paused" }
then = [
    { invoke = { device = "telegram", entity = 1, channel = 0, value = "K1C: print paused" } },
]

# Servers (linux-monitor: 2 memory, 4 system, 10 disk /, 50+ containers)

[[rules]]
name = "Notebook disk almost full: Telegram"
when = { device = "notebook", entity = 10, channel = 0, above = 90 }
cooldown = "12h"
then = [
    { invoke = { device = "telegram", entity = 1, channel = 0, value = "Notebook disk is at {value}" } },
]

[[rules]]
name = "Docker host disk almost full: Telegram"
when = { device = "docker-host", entity = 10, channel = 0, above = 90 }
cooldown = "12h"
then = [
    { invoke = { device = "telegram", entity = 1, channel = 0, value = "Docker host disk is at {value}" } },
]

[[rules]]
name = "Docker host memory high: Telegram"
when = { device = "docker-host", entity = 2, channel = 0, above = 90, for = "5m" }
then = [
    { invoke = { device = "telegram", entity = 1, channel = 0, value = "Docker host memory is at {value}" } },
]

[[rules]]
name = "Docker host restarted: Telegram"
when = { device = "docker-host", entity = 4, channel = 0, below = 600 }
then = [
    { invoke = { device = "telegram", entity = 1, channel = 0, value = "Docker host restarted" } },
]

[[rules]]

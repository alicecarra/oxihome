# Reading

[[rules]]
name = "Feeds piling up: Telegram on Sunday"
when = { cron = "0 10 * * sun" }
if = [{ device = "rss", entity = 1, channel = 1, above = 50 }]
then = [
    { invoke = { device = "telegram", entity = 1, channel = 0, value = "More than 50 unread feed items" } },
]

# House health

[[rules]]
name = "Any node offline: Telegram"
when = { offline = "*" }
cooldown = "1h"
if = [{ online = "telegram" }]
then = [
    { invoke = { device = "telegram", entity = 1, channel = 0, value = "{node} went offline" } },
]

[[rules]]
name = "Telegram bot offline: buzzer"
when = { offline = "telegram" }
cooldown = "1h"
then = [
    { invoke = { device = "esp32-08d1f9ca41e4", entity = 5, channel = 0, value = "Short" } },
    { notify = { title = "Telegram bot offline", message = "Telegram messages will not arrive" } },
]

[[rules]]
name = "Node stopped reporting: Telegram"
enabled = false
when = { stopped = "*" }
cooldown = "1h"
then = [
    { invoke = { device = "telegram", entity = 1, channel = 0, value = "{node} › {channel} stopped reporting: {detail}" } },
]

[[rules]]
name = "Node noisy: Telegram"
when = { noisy = "*" }
cooldown = "1h"
then = [
    { invoke = { device = "telegram", entity = 1, channel = 0, value = "{node} › {channel} is noisy: {detail}" } },
]

[[rules]]
name = "Node not answering: Telegram"
when = { unanswered = "*" }
cooldown = "1h"
then = [
    { invoke = { device = "telegram", entity = 1, channel = 0, value = "{node} is not answering commands: {detail}" } },
]

[[rules]]
name = "Node reported a problem: Telegram"
when = { reported = "*" }
cooldown = "1h"
then = [
    { invoke = { device = "telegram", entity = 1, channel = 0, value = "{node} reported a problem: {detail}" } },
]

# Simulator (temporary, to test placeholders)

[[rules]]
name = "Sim: living room hot"
when = { device = "sim-living-room", entity = 3, channel = 0, above = 25 }
then = [
    { invoke = { device = "telegram", entity = 1, channel = 0, value = "{node}: {channel} at {value}" } },
]

[[rules]]
name = "Sim: living room cool"
when = { device = "sim-living-room", entity = 3, channel = 0, below = 20 }
then = [
    { invoke = { device = "telegram", entity = 1, channel = 0, value = "{node}: {channel} down to {value}" } },
]

[[rules]]
name = "Sim: button toggles the bedroom lamp"
when = { device = "sim-living-room", entity = 2, channel = 0, event = "Press" }
then = [
    { toggle = { device = "sim-bedroom", entity = 1, channel = 0 } },
    { wait = "5s" },
    { invoke = { device = "telegram", entity = 1, channel = 0, value = "{node} › {channel} pressed" } },
]

[[rules]]
name = "Telegram echo"
when = { device = "telegram", entity = 2, channel = 0, event = "Received" }
then = [{ invoke = { device = "telegram", entity = 1, channel = 0, value = "Got /{value}" } }]

[[rules]]
name = "buzz when potentiometer above 50"
when = { device = "esp32-08d1f9ca41e4", entity = 7, channel = 0, above = 50.0 }
then = [
    { invoke = { device = "esp32-08d1f9ca41e4", entity = 5, channel = 0, value = "Short" } },
]

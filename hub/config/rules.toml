    { invoke = { device = "telegram", entity = 1, channel = 0, value = "Jellyfin is using {value} CPU" } },
]

[[rules]]
name = "Trilium using two cores: Telegram"
when = { device = "docker-host", entity = 52, channel = 2, above = 200, for = "5m" }
then = [
    { invoke = { device = "telegram", entity = 1, channel = 0, value = "Trilium is using {value} CPU" } },
]

[[rules]]
name = "Portainer using two cores: Telegram"
when = { device = "docker-host", entity = 53, channel = 2, above = 200, for = "5m" }
then = [
    { invoke = { device = "telegram", entity = 1, channel = 0, value = "Portainer is using {value} CPU" } },
]

[[rules]]
name = "Hub using two cores: Telegram"

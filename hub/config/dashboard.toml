# The home page: blocks in this order on a grid of three columns (one on phones).
# Block types: "nodes" (nodes by presence), "channels" (chosen channels with value and controls,
# like rules: { device, entity, channel }), "panel" (the buttons of a panel from panels.toml),
# "value" (one channel, large), "history" (a chart of one channel with 15m/1h/6h/24h buttons;
# range "15m", "1h", "6h" or "24h" sets the default, "24h" when missing), "rules" (next scheduled runs and failed rules), "events" (latest node events and
# notifications; limit 1-50, default 10).
# Optional: title, width (1-3 columns, default 1). Only the first dashboard is shown for now.

[[dashboards]]
name = "Home"

[[dashboards.blocks]]
type = "panel"
panel = "Test board"

[[dashboards.blocks]]
type = "panel"
panel = "Alarm"
width = 2

[[dashboards.blocks]]
type = "nodes"

[[dashboards.blocks]]
type = "channels"
channels = [
    { device = "weather", entity = 1, channel = 0 },
    { device = "weather", entity = 1, channel = 4 },
    { device = "weather", entity = 2, channel = 0 },
    { device = "weather", entity = 2, channel = 1 },
]

[[dashboards.blocks]]
type = "channels"
title = "Inside"
channels = [
    { device = "esp32-08d1f9ca41e4", entity = 3, channel = 0 },
    { device = "esp32-08d1f9ca41e4", entity = 3, channel = 1 },
]

[[dashboards.blocks]]
type = "value"
title = "Input"
channel = { device = "esp32-08d1f9ca41e4", entity = 7, channel = 0 }

[[dashboards.blocks]]
type = "history"
title = "Outside temperature"
width = 2
channel = { device = "weather", entity = 1, channel = 0 }

[[dashboards.blocks]]
type = "rules"

[[dashboards.blocks]]
type = "events"
width = 2

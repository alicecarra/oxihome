#channel = { device = "esp32-08d1f9ca41e4", entity = 7, channel = 0 }


# inside / outside min max
[[dashboards.blocks]]
type = "history"
title = "Inside temperature"
width = 1
channel = { device = "esp32-08d1f9ca41e4", entity = 3, channel = 0 }

[[dashboards.blocks]]
type = "history"
title = "Inside humidity"
width = 1
channel = { device = "esp32-08d1f9ca41e4", entity = 3, channel = 1 }

[[dashboards.blocks]]
type = "channels"
channels = [
    { device = "weather", entity = 2, channel = 0 },
    { device = "weather", entity = 2, channel = 1 },
    { device = "weather", entity = 1, channel = 4 },
]


# outside
[[dashboards.blocks]]
type = "history"
title = "Outside temperature"
width = 1
channel = { device = "weather", entity = 1, channel = 0 }

[[dashboards.blocks]]
type = "history"
title = "Outside humididty"
width = 1
channel = { device = "weather", entity = 1, channel = 1 }

[[dashboards.blocks]]
type = "value"
title = "Raining"
width = 1
channel = { device = "weather", entity = 1, channel = 4 }



[[dashboards.blocks]]
type = "events"
limit = 15
width = 2

[[dashboards.blocks]]
type = "feeds"
device = "rss"
width = 1

[[dashboards.blocks]]
type = "feeds"
title = "YouTube"
device = "youtube"
width = 1

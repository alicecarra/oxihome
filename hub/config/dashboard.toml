# The home page: blocks in this order on a grid of three columns (one on phones).
# Block types: "nodes" (nodes by presence), "channels" (chosen channels with value and controls,
# like rules: { device, entity, channel }), "buttons" (buttons of rules, when = { button = "..." }),
# "value" (one channel, large), "history" (a chart of one channel with 15m/1h/6h/24h buttons;
# range "15m", "1h", "6h" or "24h" sets the default, "24h" when missing), "rules" (next scheduled
# runs and failed rules), "events" (latest node events and notifications; limit 1-50, default 10),
# "feeds" (items of an rss node, device = "rss", unread first with "Show read"; limit 1-50,
# default 10).
# Optional: title, width (1-3 columns, default 1). Only the first dashboard is shown for now.

[[dashboards]]
name = "Home"

[[dashboards.blocks]]
type = "buttons"
title = "TV"
width = 1
buttons = ["Turn on TV"]

[[dashboards.blocks]]
type = "nodes"
width = 1

[[dashboards.blocks]]
type = "rules"
width = 1


#[[dashboards.blocks]]
#type = "value"

# Each node, by the id from its Hello: friendly names shown on the web interface and the desired
# operation parameters, which the hub sets on nodes that report another value.
# A name here wins over the one the node declares in its Hello; without either, a channel shows its
# quantity (e.g. Temperature) or "channel N".
# Parameter ranges: heartbeat_interval 5-300 s, wifi_check_interval 1-60 s, wifi_power_save 0-2
# (0 off, 1 light, 2 maximum; boards only); a missing one keeps the node's value.
# hardware: what is wired to each pin of a board, sent when the board mounts something else (it
# restarts to apply it); without it the hub leaves the board's hardware alone. Drivers and options:
# output (inverted = false), button (pull_up = true, toggles = <output entity>),
# dht11 (read_interval_seconds = 30, 2-3600), buzzer, ir_receiver, ir_transmitter,
# potentiometer (minimum_change = 2 percent, 1-50).

[nodes."esp32-08d1f9ca41e4"]
name = "Test board"
entities.1 = { name = "LED", channels.0 = "Power" }
entities.2 = { name = "BOOT button", channels.0 = "Press" }
entities.3 = { name = "Climate sensor" }
entities.4 = { name = "External LED", channels.0 = "Power" }
entities.5 = { name = "Buzzer", channels.0 = "Pattern" }
entities.6 = { name = "IR receiver", channels.0 = "Code" }
entities.7 = { name = "Potentiometer" }
parameters = { heartbeat_interval = 30, wifi_check_interval = 5 }
hardware = [
    { id = 1, pin = 2, driver = "output" },
    { id = 2, pin = 0, driver = "button", toggles = 1 },
    { id = 3, pin = 4, driver = "dht11" },
    { id = 4, pin = 18, driver = "output" },
    { id = 5, pin = 19, driver = "buzzer" },
    { id = 6, pin = 23, driver = "ir_receiver" },
    { id = 7, pin = 34, driver = "potentiometer" },
]

[nodes."esp32-14335c2e7270"]
name = "living room remote"
entities.1 = { name = "LED", channels.0 = "Power" }
entities.2 = { name = "BOOT button", channels.0 = "Press" }
entities.3 = { name = "IR transmitter", channels.0 = "Code" }
parameters = { heartbeat_interval = 30, wifi_check_interval = 5 }
hardware = [
    { id = 1, pin = 2, driver = "output" },
    { id = 2, pin = 0, driver = "button", toggles = 1 },
    { id = 3, pin = 18, driver = "ir_transmitter" },
    { id = 4, pin = 14, driver = "buzzer" },
]

[nodes."esp32-e8f60af8b410"]
name = "C6 board"
entities.2 = { name = "BOOT button", channels.0 = "Press" }
entities.3 = { name = "Climate sensor" }
entities.4 = { name = "IR transmitter", channels.0 = "Code" }
parameters = { heartbeat_interval = 30, wifi_check_interval = 5 }
hardware = [
    { id = 2, pin = 9, driver = "button" },
    { id = 3, pin = 6, driver = "aht20_bmp280", clock_pin = 7, read_interval_seconds = 30 },
    { id = 4, pin = 18, driver = "ir_transmitter" },
]


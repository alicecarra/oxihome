[package]
name = "oxihome-rss"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
feed-rs = "2"
html-escape = "0.2"
oxihome-node = { path = "../node", features = ["mqtt"] }
oxihome-protocol = { path = "../protocol" }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = "1"
